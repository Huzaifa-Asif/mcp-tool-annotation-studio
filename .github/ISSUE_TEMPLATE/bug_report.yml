name: Bug report
description: Report a reproducible defect without sensitive data.
body:
  - type: textarea
    id: observed
    attributes: { label: Observed behavior }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Minimal reproduction, description: Do not include credentials or personal data. }
    validations: { required: true }
