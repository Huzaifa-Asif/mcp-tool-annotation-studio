name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}' }
      - run: npm run check
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build static allowlist
        run: |
          mkdir -p _site/src
          cp index.html styles.css icon.svg _site/
          cp src/app.mjs src/core.mjs _site/src/
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
